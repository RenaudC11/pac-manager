<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAC Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh}
input{background:#161b22;border:1px solid #30363d;border-radius:5px;color:#c9d1d9;padding:6px 9px;font-size:12px;width:100%;outline:none;font-family:inherit}
input:focus{border-color:#58a6ff}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#161b22}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
.header{background:#161b22;border-bottom:1px solid #21262d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:26px;height:26px;background:#f59e0b22;border:1px solid #f59e0b44;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tabs{background:#161b22;border-bottom:1px solid #21262d;display:flex;padding:0 14px;gap:2px;flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#8b949e;padding:9px 12px;cursor:pointer;font-size:12px;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:#e6edf3;border-bottom-color:#58a6ff}
.content{padding:14px}
.section{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:14px;margin-bottom:14px}
.stitle{font-size:12px;font-weight:600;color:#e6edf3;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid #21262d}
.g-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.g-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:12px 13px}
.mval{font-size:21px;font-weight:700;font-family:monospace;color:#e6edf3;line-height:1.1}
.lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.rcard{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:10px 12px;border-top-width:3px}
.fc-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fc-cell{text-align:center;min-width:58px;padding:7px 5px;background:#0d1117;border-radius:6px;border:1px solid #21262d;flex-shrink:0}
.loi-bar{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
.loi-cell{text-align:center;min-width:58px;padding:8px 4px;background:#0d1117;border-radius:6px}
.btn{border-radius:6px;padding:7px 14px;font-size:12px;font-weight:500;background:#1f6feb22;border:1px solid #1f6feb55;color:#58a6ff}
.btn:disabled{opacity:.5;cursor:wait}
.btn-green{border-radius:6px;padding:7px 14px;font-size:12px;font-weight:500;background:#3fb95022;border:1px solid #3fb95055;color:#3fb950}
.btn-green:disabled{opacity:.5;cursor:wait}
.btn-add{border-radius:6px;padding:8px 16px;font-size:12px;font-weight:600;background:#1f6feb33;border:1px solid #58a6ff66;color:#58a6ff;width:100%;margin-top:8px}
.btn-del{background:none;border:1px solid #f8514944;color:#f85149;border-radius:4px;padding:4px 8px;font-size:11px;flex-shrink:0}
.badge{border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
.badge-hc{background:#3fb95022;color:#3fb950;border:1px solid #3fb95044}
.badge-hp{background:#f8514922;color:#f85149;border:1px solid #f8514944}
.warn{padding:10px;background:#1a1700;border:1px solid #d2992244;border-radius:7px;font-size:11px;color:#d29922;margin-bottom:10px}
.info{padding:10px;background:#0a1a2a;border:1px solid #1f6feb44;border-radius:7px;font-size:11px;color:#58a6ff;margin-bottom:10px}
.ok{padding:10px;background:#0a1a0a;border:1px solid #3fb95033;border-radius:7px;font-size:11px;color:#3fb950;margin-bottom:10px}
.errbox{padding:14px;background:#1c1010;border:1px solid #f8514944;border-radius:7px;color:#f85149;font-size:12px;margin-bottom:10px;word-break:break-all}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ai-card{border:1px solid #21262d;border-radius:7px;padding:14px;margin-bottom:10px}
.ai-rec{background:#0a1a0a;border:1px solid #3fb95033;border-radius:7px;padding:14px;margin-bottom:10px}
.ai-actions{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:14px;margin-bottom:10px}
.tado-apply{background:#0a1520;border:1px solid #3fb95033;border-radius:7px;padding:14px;margin-bottom:10px}
.tado-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #21262d}
.tado-row:last-child{border-bottom:none}
.frow{display:grid;grid-template-columns:160px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.note{padding:10px;background:#0c1020;border:1px solid #21262d;border-radius:7px;font-size:10px;color:#6e7681;line-height:1.7;margin-top:10px}
.empty{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:32px;text-align:center;color:#6b7280}
.troom{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px;margin-bottom:8px}
.troom-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.troom-name{font-size:12px;font-weight:600;color:#e6edf3}
.addbox{background:#0a1520;border:1px solid #1f6feb33;border-radius:7px;padding:14px;margin-top:4px}
.tariff-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:7px;margin-bottom:10px}
.tariff-hc{background:#0a1a0a;border:1px solid #3fb95033}
.tariff-hp{background:#1a0a0a;border:1px solid #f8514933}
.bilan-section{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:14px;margin-bottom:14px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">♨</div>
  <div>
    <div style="font-size:14px;font-weight:700;color:#e6edf3;line-height:1">PAC Manager</div>
    <div style="font-size:10px;color:#6b7280">Vitocal 150-A · Lyon · v1.9.6</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
    <span class="dot" id="dot" style="background:#3fb950"></span>
    <span style="font-size:10px;color:#6b7280" id="status">—</span>
    <span class="dot" id="save-dot" style="background:#6b7280" title="Config non sauvegardée sur serveur"></span>
    <button style="background:none;border:1px solid #30363d;color:#8b949e;border-radius:5px;padding:4px 9px;font-size:11px" onclick="appRefresh()">⟳</button>
  </div>
</div>
<div class="tabs">
  <button class="tab active" id="tb-dashboard" onclick="showTab('dashboard')">◈ Dashboard</button>
  <button class="tab" id="tb-ai" onclick="showTab('ai')">◉ IA</button>
  <button class="tab" id="tb-params" onclick="showTab('params')">◧ Paramètres</button>
  <button class="tab" id="tb-system" onclick="showTab('system')">◌ Système</button>
</div>
<div class="content">
  <div id="p-dashboard"></div>
  <div id="p-ai" style="display:none"></div>
  <div id="p-params" style="display:none"></div>
  <div id="p-system" style="display:none"></div>
</div>
<script>
var GEMINI_API_KEY = '__GEMINI_API_KEY__';
var SK = 'pac-mgr';

// Migration depuis anciennes clés
(function() {
  if (localStorage.getItem(SK)) return;
  var old = ['pac-mgr-v5','pac-mgr-v4','pac-mgr-v3','pac-mgr-v2'];
  for (var i=0; i<old.length; i++) {
    var v = localStorage.getItem(old[i]);
    if (v) { localStorage.setItem(SK, v); localStorage.removeItem(old[i]); return; }
  }
})();

var DEF = {
  system: {haUrl:'http://homeassistant.local:8123', haToken:'', lat:45.75, lon:4.85, refreshMin:5},
  functional: {loiEauA:43.0, loiEauB:-1.1, tBalance:16.0, consigneJour:18, consigneNuit:18, heureNuit:'21:30', heureJour:'05:30', consigneECS:50, hystECS:5},
  tariff: {debutHC:'22:30', finHC:'06:30', prixHP:0.25, prixHC:0.17},
  thermal: {G:333, tau:8, surface:210},
  entities: {tExt:'', tEauDep:'', copInst:'', puissElec:'', puissTherm:''},
  rooms: []
};

function parseCfg(s) {
  if (!s) return JSON.parse(JSON.stringify(DEF));
  return {
    system:    Object.assign({}, DEF.system,    s.system),
    functional:Object.assign({}, DEF.functional, s.functional),
    tariff:    Object.assign({}, DEF.tariff,    s.tariff),
    thermal:   Object.assign({}, DEF.thermal,   s.thermal),
    entities:  Object.assign({}, DEF.entities,  s.entities),
    rooms: s.rooms || []
  };
}

function loadCfg() {
  try {
    var s = JSON.parse(localStorage.getItem(SK));
    return parseCfg(s);
  } catch(e) { return JSON.parse(JSON.stringify(DEF)); }
}

var cfg = loadCfg();
var haData = {}, weather = null, lastUpd = null, aiResult = null, currentTab = 'dashboard';

// Charger config depuis serveur (prioritaire, survit au changement de PC)
fetch('/pac-config')
  .then(function(r) { return r.ok ? r.json() : null; })
  .then(function(sc) {
    if (!sc || Object.keys(sc).length === 0) return;
    cfg = parseCfg(sc);
    try { localStorage.setItem(SK, JSON.stringify(cfg)); } catch(e) {}
    var d = document.getElementById('save-dot');
    if (d) { d.style.background = '#3fb950'; d.title = 'Config chargée depuis serveur'; }
    renderCurrent();
  })
  .catch(function() {});

function save() {
  try { localStorage.setItem(SK, JSON.stringify(cfg)); } catch(e) {}
  fetch('/pac-config', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(cfg)
  }).then(function(r) {
    var d = document.getElementById('save-dot');
    if (d) { d.style.background = r.ok ? '#3fb950' : '#f85149'; d.title = r.ok ? 'Config sauvegardée' : 'Erreur sauvegarde'; }
  }).catch(function() {
    var d = document.getElementById('save-dot');
    if (d) { d.style.background = '#d29922'; d.title = 'Serveur config indisponible (localStorage ok)'; }
  });
}

function tEauCalc(t) { return Math.max(25, Math.min(55, cfg.functional.loiEauA + cfg.functional.loiEauB * t)); }
function fmt(v, d) { d = d === undefined ? 1 : d; return v != null ? parseFloat(v).toFixed(d) : '—'; }

function isNight() {
  var n = new Date(), cur = n.getHours()*60 + n.getMinutes();
  var ni = parseInt(cfg.functional.heureNuit.split(':')[0])*60 + parseInt(cfg.functional.heureNuit.split(':')[1]);
  var di = parseInt(cfg.functional.heureJour.split(':')[0])*60 + parseInt(cfg.functional.heureJour.split(':')[1]);
  return ni > di ? (cur >= ni || cur < di) : (cur >= ni && cur < di);
}

function isHC() {
  var n = new Date(), cur = n.getHours()*60 + n.getMinutes();
  var hcs = parseInt(cfg.tariff.debutHC.split(':')[0])*60 + parseInt(cfg.tariff.debutHC.split(':')[1]);
  var hce = parseInt(cfg.tariff.finHC.split(':')[0])*60 + parseInt(cfg.tariff.finHC.split(':')[1]);
  return hcs > hce ? (cur >= hcs || cur < hce) : (cur >= hcs && cur < hce);
}

function minsJusquaChangement() {
  var n = new Date(), cur = n.getHours()*60 + n.getMinutes();
  var hcs = parseInt(cfg.tariff.debutHC.split(':')[0])*60 + parseInt(cfg.tariff.debutHC.split(':')[1]);
  var hce = parseInt(cfg.tariff.finHC.split(':')[0])*60 + parseInt(cfg.tariff.finHC.split(':')[1]);
  var next = isHC() ? (hce > cur ? hce - cur : 1440 - cur + hce) : (hcs > cur ? hcs - cur : 1440 - cur + hcs);
  return next;
}

function prixActuel() { return isHC() ? cfg.tariff.prixHC : cfg.tariff.prixHP; }

function detectModePAC(teau, pw) {
  if (pw === null || pw < 70) return 'ARRET';
  if (teau !== null && teau > 45) return 'ECS';
  return 'CHAUFFAGE';
}

function tIntMoyenne() {
  if (cfg.rooms.length === 0) return null;
  var surfTot = cfg.rooms.reduce(function(s,r){ return s+(r.surface||0); }, 0);
  if (surfTot > 0) {
    var som = 0, sd = 0;
    cfg.rooms.forEach(function(r) {
      var t = haData[r.entityTemp] ? parseFloat(haData[r.entityTemp].state) : null;
      if (t !== null) { som += t*(r.surface||0); sd += (r.surface||0); }
    });
    return sd > 0 ? som/sd : null;
  } else {
    var vals = cfg.rooms.filter(function(r){ return haData[r.entityTemp]; })
                        .map(function(r){ return parseFloat(haData[r.entityTemp].state); });
    return vals.length > 0 ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
  }
}

function haGet(id) {
  return fetch(cfg.system.haUrl + '/api/states/' + id, {
    headers: {Authorization:'Bearer '+cfg.system.haToken, 'Content-Type':'application/json'}
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}

function haSetTemp(entityId, temp) {
  return fetch(cfg.system.haUrl + '/api/services/climate/set_temperature', {
    method:'POST', headers:{Authorization:'Bearer '+cfg.system.haToken, 'Content-Type':'application/json'},
    body: JSON.stringify({entity_id:entityId, temperature:temp})
  }).then(function(r){ if(!r.ok) throw new Error('HA '+r.status); return r; });
}

function setStatus(col, txt) {
  var d = document.getElementById('dot'), s = document.getElementById('status');
  if (d) d.style.background = col;
  if (s) s.textContent = txt;
}

function mk(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function appRefresh() {
  setStatus('#d29922', 'Actualisation…');
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+cfg.system.lat+'&longitude='+cfg.system.lon+'&current_weather=true&hourly=temperature_2m,cloud_cover&forecast_days=2&timezone=Europe%2FParis')
    .then(function(r){ return r.json(); }).then(function(d){ weather=d; }).catch(function(){ weather=null; })
    .then(function() {
      if (!cfg.system.haToken) { lastUpd=new Date(); setStatus('#3fb950',lastUpd.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})); renderCurrent(); return; }
      var ids = Object.values(cfg.entities).concat(cfg.rooms.reduce(function(a,r){ return a.concat([r.entityTemp,r.entitySetpoint]); },[])).filter(Boolean);
      return Promise.all(ids.map(function(id){ return haGet(id).then(function(d){ haData[id]=d; }).catch(function(){}); }));
    })
    .then(function(){ lastUpd=new Date(); setStatus('#3fb950',lastUpd.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})); renderCurrent(); });
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  var btn = document.getElementById('tb-'+id); if (btn) btn.classList.add('active');
  ['dashboard','ai','params','system'].forEach(function(t){
    var p = document.getElementById('p-'+t); if (p) p.style.display = t===id?'block':'none';
  });
  currentTab = id; renderCurrent();
}

function renderCurrent() {
  if (currentTab==='dashboard') renderDashboard();
  else if (currentTab==='ai') renderAI();
  else if (currentTab==='params') renderParams();
  else if (currentTab==='system') renderSystem();
}

// ── Dashboard ──────────────────────────────────────────────────────────────────
function renderDashboard() {
  var div = document.getElementById('p-dashboard'); if (!div) return; div.innerHTML='';
  var tExt = cfg.entities.tExt&&haData[cfg.entities.tExt] ? parseFloat(haData[cfg.entities.tExt].state) : (weather&&weather.current_weather?weather.current_weather.temperature:null);
  var tEauCalcVal = tExt!==null ? tEauCalc(tExt) : null;
  var tEauAct = cfg.entities.tEauDep&&haData[cfg.entities.tEauDep] ? parseFloat(haData[cfg.entities.tEauDep].state) : null;
  var cop = cfg.entities.copInst&&haData[cfg.entities.copInst] ? parseFloat(haData[cfg.entities.copInst].state) : null;
  var pw = cfg.entities.puissElec&&haData[cfg.entities.puissElec] ? parseFloat(haData[cfg.entities.puissElec].state)*1000 : null;
  var pt = cfg.entities.puissTherm&&haData[cfg.entities.puissTherm] ? parseFloat(haData[cfg.entities.puissTherm].state)*1000 : null;
  var modePAC = detectModePAC(tEauAct, pw);
  var pacColor = modePAC==='CHAUFFAGE'?'#3fb950':modePAC==='ECS'?'#f59e0b':'#6b7280';
  var hc = isHC();
  var mins = minsJusquaChangement();
  var tarifStr = (hc?'HC':'HP')+' — change dans '+Math.floor(mins/60)+'h'+(mins%60>0?mins%60+'min':'');

  // Bandeau tarifaire
  var tb = mk('div', hc?'tariff-bar tariff-hc':'tariff-bar tariff-hp');
  tb.innerHTML = '<span class="badge '+(hc?'badge-hc':'badge-hp')+'">'+(hc?'Heures Creuses':'Heures Pleines')+'</span>'
    +'<span style="font-size:11px;color:#8b949e">'+tarifStr+'</span>'
    +'<span style="margin-left:auto;font-size:11px;font-weight:600;color:'+(hc?'#3fb950':'#f85149')+'">'+prixActuel().toFixed(2)+' €/kWh</span>';
  div.append(tb);

  if (pw && pw > 70) {
    var ch = mk('div'); ch.style.cssText='font-size:10px;color:#6b7280;margin-bottom:12px;text-align:right';
    ch.textContent='Coût estimé : '+(pw/1000*prixActuel()).toFixed(3)+' €/h · '+(pw/1000*prixActuel()*24).toFixed(2)+' €/jour si continu';
    div.append(ch);
  }

  // Métriques
  var mg = mk('div','g-auto');
  var metrics = [
    ['T° extérieure', tExt!==null?fmt(tExt):null, '°C', cfg.entities.tExt&&haData[cfg.entities.tExt]?'Capteur HA':'Open-Meteo', '#58a6ff'],
    ['T° eau actuelle', tEauAct!==null?fmt(tEauAct):null, '°C', tEauAct?(tEauAct>45?'Mode ECS':'Chauffage'):'Non configuré', '#f59e0b'],
    ['T° eau cible', tEauCalcVal!==null?fmt(tEauCalcVal):null, '°C', 'Loi d\'eau', '#d29922'],
    ['COP', cop!==null?fmt(cop,2):null, '', cop?(cop>4?'Excellent':cop>3?'Bon':'Moyen'):'', '#3fb950'],
    ['Puissance élec.', pw!==null?(pw/1000).toFixed(2):null, 'kW', pw===null?'Non configuré':pw<70?'En veille':'En marche', '#f85149'],
    ['Puissance therm.', pt!==null?(pt/1000).toFixed(2):null, 'kW', pt&&pw&&pw>0?'COP='+((pt/pw).toFixed(1)):'', '#a78bfa'],
    ['Mode PAC', modePAC==='ARRET'?'Veille':modePAC==='CHAUFFAGE'?'Chauffe':'ECS', '', (isNight()?'Nuit ':'Jour ')+cfg.functional[isNight()?'consigneNuit':'consigneJour']+'°C', pacColor]
  ];
  metrics.forEach(function(x){
    var c=mk('div','metric'); c.style.borderLeft='3px solid '+x[4];
    c.innerHTML='<div class="lbl">'+x[0]+'</div><div class="mval">'+(x[1]||'—')+(x[2]?'<span style="font-size:12px;color:#6b7280;margin-left:2px">'+x[2]+'</span>':'')+'</div>'+(x[3]?'<div style="font-size:10px;color:#6b7280;margin-top:3px">'+x[3]+'</div>':'');
    mg.append(c);
  });
  div.append(mg);

  // Bilan thermique
  var tInt = tIntMoyenne();
  var surfTot = cfg.rooms.reduce(function(s,r){ return s+(r.surface||0); }, 0);
  if (tInt !== null && tExt !== null && cfg.thermal.G > 0) {
    var pertes = cfg.thermal.G * (tInt - tExt);
    var bilan = pt!==null && modePAC==='CHAUFFAGE' ? pt - pertes : null;
    var bilanCol = bilan===null?'#6b7280':bilan>200?'#3fb950':bilan<-200?'#f85149':'#d29922';
    var bilanTxt = bilan===null?(modePAC==='ECS'?'PAC mode ECS':modePAC==='ARRET'?'PAC à l\'arrêt':'Puissance therm. non configurée')
      :bilan>200?'Se réchauffe (+'+Math.round(bilan)+'W)'
      :bilan<-200?'Se refroidit ('+Math.round(bilan)+'W)'
      :'Équilibre (±'+Math.round(Math.abs(bilan))+'W)';
    var methode = surfTot>0?'Moy. pondérée ('+surfTot.toFixed(0)+'m²)':'Moy. simple';
    var bs = mk('div','bilan-section');
    bs.innerHTML='<div class="stitle">Bilan thermique temps réel</div>'
      +'<div class="g-auto">'
      +'<div class="metric" style="border-left:3px solid #58a6ff"><div class="lbl">T° int. moy.</div><div class="mval">'+tInt.toFixed(1)+'<span style="font-size:12px;color:#6b7280;margin-left:2px">°C</span></div><div style="font-size:10px;color:#6b7280;margin-top:3px">'+methode+'</div></div>'
      +'<div class="metric" style="border-left:3px solid #f85149"><div class="lbl">Pertes estimées</div><div class="mval">'+(pertes/1000).toFixed(2)+'<span style="font-size:12px;color:#6b7280;margin-left:2px">kW</span></div><div style="font-size:10px;color:#6b7280;margin-top:3px">G='+cfg.thermal.G+'W/°C × ΔT='+(tInt-tExt).toFixed(1)+'°C</div></div>'
      +(pt!==null&&modePAC==='CHAUFFAGE'?'<div class="metric" style="border-left:3px solid #a78bfa"><div class="lbl">Production PAC</div><div class="mval">'+(pt/1000).toFixed(2)+'<span style="font-size:12px;color:#6b7280;margin-left:2px">kW</span></div><div style="font-size:10px;color:#6b7280;margin-top:3px">Mode chauffage</div></div>':'')
      +'<div class="metric" style="border-left:3px solid '+bilanCol+'"><div class="lbl">Bilan</div><div class="mval" style="font-size:13px;color:'+bilanCol+'">'+bilanTxt+'</div></div>'
      +'</div>';
    div.append(bs);
  }

  // Pièces par étage
  if (cfg.rooms.length > 0) {
    var etages = {};
    cfg.rooms.forEach(function(r){ var e=r.etage||'Pièces'; if(!etages[e]) etages[e]=[]; etages[e].push(r); });
    var eKeys = Object.keys(etages).sort(function(a,b){ if(a==='Pièces')return 1; if(b==='Pièces')return -1; return a.localeCompare(b); });
    eKeys.forEach(function(etage){
      var rh=mk('div'); rh.style.marginBottom='14px';
      rh.innerHTML='<div style="font-size:11px;font-weight:600;color:#e6edf3;margin-bottom:8px;text-transform:uppercase;letter-spacing:.07em">'+etage+'</div>';
      var rg=mk('div','g-rooms');
      etages[etage].forEach(function(r){
        var t=haData[r.entityTemp]?haData[r.entityTemp].state:null;
        var sp=haData[r.entitySetpoint]?(haData[r.entitySetpoint].attributes&&haData[r.entitySetpoint].attributes.temperature?haData[r.entitySetpoint].attributes.temperature:haData[r.entitySetpoint].state):null;
        var d=t&&sp?parseFloat(t)-parseFloat(sp):null;
        var col=d===null?'#6b7280':d>=0?'#3fb950':d<-1.5?'#f85149':'#d29922';
        var c=mk('div','rcard'); c.style.borderTopColor=col;
        c.innerHTML='<div style="font-size:11px;color:#8b949e;margin-bottom:5px;font-weight:500">'+r.name+(r.surface?'<span style="font-size:9px;color:#4b5563;margin-left:4px">'+r.surface+'m²</span>':'')+'</div>'
          +'<div style="display:flex;align-items:baseline;gap:5px"><span style="font-size:20px;font-weight:700;font-family:monospace;color:#e6edf3">'+(t?fmt(t)+'°':'—')+'</span>'+(sp?'<span style="font-size:11px;color:#6b7280">/ '+fmt(sp,0)+'°C</span>':'')+'</div>'
          +(d!==null?'<div style="font-size:10px;color:'+col+';margin-top:2px">'+(d>=0?'+':'')+d.toFixed(1)+'°C vs consigne</div>':'');
        rg.append(c);
      });
      rh.append(rg); div.append(rh);
    });
  } else {
    div.append(mk('div','info','💡 Aucune pièce Tado — ajoutez-en dans l\'onglet Système.'));
  }

  // Prévisions 24h
  if (weather&&weather.hourly) {
    var now=new Date(), h=weather.hourly;
    var fc=h.time.map(function(t,i){ return {time:t,temp:h.temperature_2m[i],cloud:h.cloud_cover[i]}; })
      .filter(function(p){ var d=new Date(p.time); return d>=now&&d<=new Date(now.getTime()+24*3600000); })
      .filter(function(_,i){ return i%2===0; }).slice(0,8);
    if (fc.length) {
      var fs=mk('div','section','<div class="stitle">Prévisions 24h</div>');
      var bar=mk('div','fc-bar');
      fc.forEach(function(p){
        var tv=tEauCalc(p.temp), off=p.temp>=cfg.functional.tBalance, col=p.temp<5?'#58a6ff':p.temp>15?'#3fb950':'#c9d1d9';
        var ph=parseInt(p.time.slice(11,13)), pcur=ph*60;
        var hcs=parseInt(cfg.tariff.debutHC.split(':')[0])*60+parseInt(cfg.tariff.debutHC.split(':')[1]);
        var hce=parseInt(cfg.tariff.finHC.split(':')[0])*60+parseInt(cfg.tariff.finHC.split(':')[1]);
        var phc=hcs>hce?(pcur>=hcs||pcur<hce):(pcur>=hcs&&pcur<hce);
        var cell=mk('div','fc-cell'); cell.style.borderColor=phc?'#3fb95044':'#21262d';
        cell.innerHTML='<div style="font-size:10px;color:'+(phc?'#3fb950':'#6b7280')+';margin-bottom:3px">'+p.time.slice(11,16)+(phc?' HC':'')+'</div>'
          +'<div style="font-size:14px;font-weight:700;font-family:monospace;color:'+col+'">'+p.temp.toFixed(0)+'°</div>'
          +'<div style="font-size:9px;color:'+(off?'#6b7280':'#f59e0b')+';margin-top:2px">'+(off?'off':tv.toFixed(0)+'°eau')+'</div>'
          +'<div style="font-size:9px;color:#4b5563;margin-top:1px">'+p.cloud+'%☁</div>';
        bar.append(cell);
      });
      fs.append(bar); div.append(fs);
    }
  }

  if (!cfg.system.haToken) div.append(mk('div','warn','⚠ Token HA non configuré — onglet Système.'));
  if (lastUpd) { var ts=mk('div'); ts.style.cssText='margin-top:10px;font-size:10px;color:#4b5563;text-align:right'; ts.textContent='Mis à jour '+lastUpd.toLocaleTimeString('fr-FR'); div.append(ts); }
}

      +'<span style="font-size:28px;font-weight:700;font-family:monospace;color:#3fb950">'+parseFloat(aiResult.teau_recommandee).toFixed(1)+'°C</span>'
      +(cfg.entities.tEauDep&&haData[cfg.entities.tEauDep]?'<span style="font-size:12px;color:#6b7280">actuel: '+fmt(haData[cfg.entities.tEauDep]?parseFloat(haData[cfg.entities.tEauDep].state):null)+'°C</span>':'')
      +'</div>'+(aiResult.raison_teau?'<div style="font-size:11px;color:#8b949e">'+aiResult.raison_teau+'</div>':'');
    div.append(rec);
  }
  if (aiResult.actions&&aiResult.actions.length) {
    var ac2=mk('div','ai-actions','<div class="stitle">Actions recommandées</div>');
    aiResult.actions.forEach(function(a){ var row=mk('div'); row.style.cssText='display:flex;gap:6px;margin-bottom:6px;font-size:12px;color:#c9d1d9;line-height:1.5'; row.innerHTML='<span style="color:#58a6ff;flex-shrink:0">→</span>'+a; ac2.append(row); });

  if (aiResult.consignes_tado&&aiResult.consignes_tado.length&&cfg.system.haToken) {

      ta.append(row);

function applyTado(btn) {
  if (!aiResult||!aiResult.consignes_tado) return;
  btn.disabled=true; btn.textContent='⟳ Application…';
  var ps=aiResult.consignes_tado.map(function(c){
    var room=cfg.rooms.find(function(r){ return r.name===c.nom; });
    if (!room||!room.entitySetpoint) return Promise.resolve();
    return haSetTemp(room.entitySetpoint, c.consigne).catch(function(){});
  });
  Promise.all(ps).then(function(){ btn.textContent='✓ Consignes appliquées'; setTimeout(function(){ appRefresh(); }, 2000); });
}

function runAI() {
  var apiOk=GEMINI_API_KEY&&GEMINI_API_KEY.length>10&&GEMINI_API_KEY.indexOf('__GEMINI')===-1;
  if (!apiOk) { alert('Clé API Gemini non configurée.'); return; }
  var btn=document.querySelector('#p-ai .btn');
  if (btn) { btn.disabled=true; btn.textContent='⟳ Analyse…'; }

  var tExt=cfg.entities.tExt&&haData[cfg.entities.tExt]?parseFloat(haData[cfg.entities.tExt].state):(weather&&weather.current_weather?weather.current_weather.temperature:null);
  var tEauCalcVal=tExt!==null?tEauCalc(tExt):null;
  var tEauAct=cfg.entities.tEauDep&&haData[cfg.entities.tEauDep]?parseFloat(haData[cfg.entities.tEauDep].state):null;
  var cop=cfg.entities.copInst&&haData[cfg.entities.copInst]?parseFloat(haData[cfg.entities.copInst].state):null;
  var pw=cfg.entities.puissElec&&haData[cfg.entities.puissElec]?parseFloat(haData[cfg.entities.puissElec].state)*1000:null;
  var pt=cfg.entities.puissTherm&&haData[cfg.entities.puissTherm]?parseFloat(haData[cfg.entities.puissTherm].state)*1000:null;
  var modePAC=detectModePAC(tEauAct,pw);
  var hc=isHC(), mins=minsJusquaChangement();
  var tInt=tIntMoyenne();
  var surfTot=cfg.rooms.reduce(function(s,r){ return s+(r.surface||0); },0);
  var pertes=tInt!==null&&tExt!==null?cfg.thermal.G*(tInt-tExt):null;
  var bilan=pertes!==null&&pt!==null&&modePAC==='CHAUFFAGE'?pt-pertes:null;

  var pCtx=cfg.rooms.map(function(r){
    var t=haData[r.entityTemp]?haData[r.entityTemp].state:'?';
    var sp=haData[r.entitySetpoint]?(haData[r.entitySetpoint].attributes&&haData[r.entitySetpoint].attributes.temperature?haData[r.entitySetpoint].attributes.temperature:cfg.functional.consigneJour):cfg.functional.consigneJour;
    return r.name+':'+t+'C/consigne'+sp+'C'+(r.surface?'/'+r.surface+'m2':'');
  }).join(' | ')||'aucune';

  var now=new Date();
  var mois=['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'][now.getMonth()];
  var tendance='stable';
  if (weather&&weather.hourly&&weather.hourly.temperature_2m.length>6) {
    var t0=weather.hourly.temperature_2m[0], t6=weather.hourly.temperature_2m[6];
    if (t6-t0>2) tendance='hausse(+'+( t6-t0).toFixed(1)+'C/6h)';
    else if (t0-t6>2) tendance='baisse(-'+(t0-t6).toFixed(1)+'C/6h)';
  }

  var meteo='indisponible';
  if (weather&&weather.hourly) {
    var h=weather.hourly;
    var fc=h.time.map(function(t,i){ return {time:t,temp:h.temperature_2m[i]}; })
      .filter(function(p){ var d=new Date(p.time); return d>=now&&d<=new Date(now.getTime()+12*3600000); })
      .filter(function(_,i){ return i%3===0; }).slice(0,4);
    if (fc.length) meteo=fc.map(function(p){ return p.time.slice(11,16)+':'+p.temp+'C'; }).join(' ');
  }

  var tarif24='';
  for (var ii=0; ii<24; ii+=3) {
    var ph=(now.getHours()+ii)%24, pcur2=ph*60;
    var hcs=parseInt(cfg.tariff.debutHC.split(':')[0])*60+parseInt(cfg.tariff.debutHC.split(':')[1]);
    var hce=parseInt(cfg.tariff.finHC.split(':')[0])*60+parseInt(cfg.tariff.finHC.split(':')[1]);
    var phc=hcs>hce?(pcur2>=hcs||pcur2<hce):(pcur2>=hcs&&pcur2<hce);
    tarif24+=ph+'h:'+(phc?'HC':'HP')+' ';
  }

  var prompt='Expert PAC. JSON uniquement.\n'
    +'INSTALLATION: 210m2 fonte haute-inertie monozone, Vitocal150A, '+mois+'\n'
    +'THERMIQUE: G='+cfg.thermal.G+'W/C tau='+cfg.thermal.tau+'h\n'
    +'ETAT: Text='+tExt+'C('+tendance+') Teau_act='+tEauAct+'C Teau_calc='+(tEauCalcVal?tEauCalcVal.toFixed(1):null)+'C\n'
    +'  ecart='+((tEauAct&&tEauCalcVal)?(tEauAct-tEauCalcVal).toFixed(1)+'C':'?')+' mode_pac='+modePAC+' puiss_elec='+(pw!==null?Math.round(pw)+'W':'?')+' puiss_therm='+(pt!==null?Math.round(pt)+'W':'?')+'\n'
    +'  Tint_moy='+(tInt?tInt.toFixed(1)+'C('+surfTot+'m2 ponderes)':'?')+' pertes='+(pertes?Math.round(pertes)+'W':'?')+' bilan='+(bilan?Math.round(bilan)+'W('+( bilan>200?'rechauffe':bilan<-200?'refroidit':'equilibre')+')':'?')+'\n'
    +'  LOGIQUE ARRET PAC: point_equilibre='+cfg.functional.tBalance+'C. '+(tExt!==null?  +'Si Text('+tExt+'C) > equilibre('+cfg.functional.tBalance+'C) → PAC doit etre arretee. '  +'Si Text('+tExt+'C) < equilibre('+cfg.functional.tBalance+'C) → PAC peut chauffer. '  +'Ici Text='+tExt+'C est '+(tExt>cfg.functional.tBalance?'SUPERIEURE':'INFERIEURE')+' a equilibre='+cfg.functional.tBalance+'C donc PAC '+(tExt>cfg.functional.tBalance?'DOIT etre arretee':'PEUT chauffer')+'.'  :'inconnu')  +'\n'
    +'  tarif_actuel='+(hc?'HC':'HP')+' change_dans='+Math.floor(mins/60)+'h prix='+prixActuel()+'eur/kWh\n'
    +'PIECES: '+pCtx+'\n'
    +'METEO12H: '+meteo+'\n'
    +'TARIFS24H: '+tarif24+'\n'
    +'LOI_EAU: Teau='+cfg.functional.loiEauA+'+('+cfg.functional.loiEauB+'xText) equil='+cfg.functional.tBalance+'C\n'
    +'CONSIGNES: jour='+cfg.functional.consigneJour+'C nuit='+cfg.functional.consigneNuit+'C\n'
    +'REGLES:\n'
    +'- teau_recommandee=temperature eau circuit 25-55C, JAMAIS temperature exterieure\n'
    +'- Si mode ECS: ignorer consignes chauffage\n'
    +'- TARIF HC (electricite bon marche='+(hc?'ACTUEL':'non actuel')+'): '+(hc?'MONTER consignes Tado +0.5 a +1C pour stocker chaleur pas chere dans inertie fonte.':'Ne pas augmenter, attendre les HC.')+'\n'
    +'- TARIF HP (electricite chere='+(hc?'non actuel':'ACTUEL')+'): '+(hc?'':'BAISSER consignes Tado -0.5C si pieces a consigne pour economiser.')+'\n'
    +'- Ne jamais prechauffer avant les HC: augmenter uniquement PENDANT les HC\n'
    +'- En fin HC (passage HC->HP dans <30min): ne plus augmenter, laisser inertie fonte restituer\n'
    +'JSON(une phrase par texte):\n'
    +'{"performance":"Bon","teau_recommandee":31.0,"raison_teau":"...","analyse":"...","actions":["..."],"consignes_tado":[{"nom":"NomPiece","consigne":18.5,"raison":"..."}],"alertes":[]}';

  fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+GEMINI_API_KEY,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:0,maxOutputTokens:2048,thinkingConfig:{thinkingBudget:0},responseMimeType:'application/json',
        responseSchema:{type:'OBJECT',properties:{
          performance:{type:'STRING'},teau_recommandee:{type:'NUMBER'},raison_teau:{type:'STRING'},
          analyse:{type:'STRING'},actions:{type:'ARRAY',items:{type:'STRING'}},
          consignes_tado:{type:'ARRAY',items:{type:'OBJECT',properties:{nom:{type:'STRING'},consigne:{type:'NUMBER'},raison:{type:'STRING'}},required:['nom','consigne','raison']}},
          alertes:{type:'ARRAY',items:{type:'STRING'}}
        },required:['performance','teau_recommandee','raison_teau','analyse','actions','consignes_tado','alertes']}
      }
    })
  })
  .then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error('Gemini '+r.status+': '+t.slice(0,300));}); return r.json(); })
  .then(function(data){
    var raw=''; try{raw=data.candidates[0].content.parts[0].text;}catch(e){throw new Error('Reponse inattendue: '+JSON.stringify(data).slice(0,300));}
    var clean=raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```\s*$/,'').trim();
    var s=clean.indexOf('{'),e=clean.lastIndexOf('}');
    if(s===-1||e===-1||e<=s) throw new Error('JSON invalide: '+clean.slice(0,200));
    aiResult=JSON.parse(clean.slice(s,e+1));
    if(!aiResult.teau_recommandee||aiResult.teau_recommandee<25||aiResult.teau_recommandee>55)
      aiResult.teau_recommandee=tEauCalcVal?parseFloat(tEauCalcVal.toFixed(1)):35.0;
    if(aiResult.consignes_tado){
      var noms=cfg.rooms.map(function(r){return r.name;});
      aiResult.consignes_tado=aiResult.consignes_tado.filter(function(c){return noms.indexOf(c.nom)!==-1;});
    }
    aiResult.ts=new Date();
  })
  .catch(function(e){aiResult={error:e.message,ts:new Date()};})
  .then(function(){renderAI();});
}

  var s2=mk('div','section');
  s2.innerHTML='<div class="stitle">Consignes</div><div class="g3">'
    +'<div><div class="lbl">Jour (°C)</div><input type="number" step="0.5" id="f-cJ" value="'+cfg.functional.consigneJour+'"></div>'
    +'<div><div class="lbl">Nuit (°C)</div><input type="number" step="0.5" id="f-cN" value="'+cfg.functional.consigneNuit+'"></div>'
    +'<div><div class="lbl">ECS (°C)</div><input type="number" step="1" id="f-cE" value="'+cfg.functional.consigneECS+'"></div>'
    +'<div><div class="lbl">Début nuit</div><input type="time" id="f-hN" value="'+cfg.functional.heureNuit+'"></div>'
    +'<div><div class="lbl">Fin nuit</div><input type="time" id="f-hJ" value="'+cfg.functional.heureJour+'"></div>'
    +'<div><div class="lbl">Hystérésis ECS</div><input type="number" step="1" id="f-hE" value="'+cfg.functional.hystECS+'"></div>'
    +'</div>';
  div.append(s2);
  [['f-cJ','consigneJour'],['f-cN','consigneNuit'],['f-cE','consigneECS'],['f-hE','hystECS']].forEach(function(x){
    var el=document.getElementById(x[0]); if(!el) return;
    el.addEventListener('change',function(e){cfg.functional[x[1]]=parseFloat(e.target.value);save();});
  });
  [['f-hN','heureNuit'],['f-hJ','heureJour']].forEach(function(x){
    var el=document.getElementById(x[0]); if(!el) return;
    el.addEventListener('change',function(e){cfg.functional[x[1]]=e.target.value;save();});
  });

  // Tarification HP/HC
  var s3=mk('div','section');
  s3.innerHTML='<div class="stitle">Tarification HP/HC</div><div class="g2" style="margin-bottom:10px">'
    +'<div><div class="lbl">Début HC (soir)</div><input type="time" id="f-dHC" value="'+cfg.tariff.debutHC+'"></div>'
    +'<div><div class="lbl">Fin HC (matin)</div><input type="time" id="f-fHC" value="'+cfg.tariff.finHC+'"></div>'
    +'</div><div class="g2">'
    +'<div><div class="lbl">Prix HP (€/kWh)</div><input type="number" step="0.001" id="f-pHP" value="'+cfg.tariff.prixHP+'"></div>'
    +'<div><div class="lbl">Prix HC (€/kWh)</div><input type="number" step="0.001" id="f-pHC" value="'+cfg.tariff.prixHC+'"></div>'
    +'</div>';
  div.append(s3);
  [['f-dHC','debutHC'],['f-fHC','finHC']].forEach(function(x){
    var el=document.getElementById(x[0]); if(!el) return;
    el.addEventListener('change',function(e){cfg.tariff[x[1]]=e.target.value;save();});
  });
  [['f-pHP','prixHP'],['f-pHC','prixHC']].forEach(function(x){
    var el=document.getElementById(x[0]); if(!el) return;
    el.addEventListener('change',function(e){cfg.tariff[x[1]]=parseFloat(e.target.value);save();});
  });

  // Paramètres thermiques
  var s4=mk('div','section');
  s4.innerHTML='<div class="stitle">Paramètres thermiques maison</div><div class="g3">'
    +'<div><div class="lbl">G — déperditions (W/°C)</div><input type="number" step="1" id="f-G" value="'+cfg.thermal.G+'"><div style="font-size:10px;color:#6b7280;margin-top:3px">Pertes = G × ΔT</div></div>'
    +'<div><div class="lbl">τ — inertie (heures)</div><input type="number" step="0.5" id="f-tau" value="'+cfg.thermal.tau+'"><div style="font-size:10px;color:#6b7280;margin-top:3px">Temps de réaction</div></div>'
    +'<div><div class="lbl">Surface chauffée (m²)</div><input type="number" step="1" id="f-surf" value="'+cfg.thermal.surface+'"></div>'
    +'</div>';
  div.append(s4);
  [['f-G','G'],['f-tau','tau'],['f-surf','surface']].forEach(function(x){
    var el=document.getElementById(x[0]); if(!el) return;
    el.addEventListener('change',function(e){cfg.thermal[x[1]]=parseFloat(e.target.value);save();});
  });

  // Estimation pertes actuelles
  var tExt2=cfg.entities.tExt&&haData[cfg.entities.tExt]?parseFloat(haData[cfg.entities.tExt].state):(weather&&weather.current_weather?weather.current_weather.temperature:null);
  var tInt2=tIntMoyenne();
  if (tExt2!==null && tInt2!==null) {
    var pActuelles=cfg.thermal.G*(tInt2-tExt2);
    var ni=mk('div','info');
    ni.innerHTML='<strong>Estimation pertes actuelles :</strong> '+(pActuelles/1000).toFixed(2)+'kW — '+(pActuelles*24/1000).toFixed(1)+' kWh/jour'
      +' <span style="color:#6b7280">(G='+cfg.thermal.G+'W/°C × ΔT='+(tInt2-tExt2).toFixed(1)+'°C, Tint_moy='+tInt2.toFixed(1)+'°C)</span>';
    div.append(ni);
  }
}

// ── Système ──────────────────────────────────────────────────────────────────────
function renderSystem() {
  var div=document.getElementById('p-system'); if(!div) return; div.innerHTML='';

  // Connexion HA
  var s1=mk('div','section');
  s1.innerHTML='<div class="stitle">Connexion Home Assistant</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +'<div><div class="lbl">URL HA</div><input id="s-url" value="'+cfg.system.haUrl+'"></div>'
    +'<div><div class="lbl">Token longue durée</div><input type="password" id="s-tok" value="'+cfg.system.haToken+'" placeholder="eyJ0eXAi..."></div>'
    +'<div class="g3"><div><div class="lbl">Latitude</div><input type="number" step="0.01" id="s-lat" value="'+cfg.system.lat+'"></div>'
    +'<div><div class="lbl">Longitude</div><input type="number" step="0.01" id="s-lon" value="'+cfg.system.lon+'"></div>'
    +'<div><div class="lbl">Refresh (min)</div><input type="number" min="1" max="60" id="s-ref" value="'+cfg.system.refreshMin+'"></div></div>'
    +'</div>';
  div.append(s1);
  [['s-url','haUrl'],['s-tok','haToken']].forEach(function(x){
    var el=document.getElementById(x[0]); if(!el) return;
    el.addEventListener('change',function(e){cfg.system[x[1]]=e.target.value;save();});
  });
  [['s-lat','lat'],['s-lon','lon'],['s-ref','refreshMin']].forEach(function(x){
    var el=document.getElementById(x[0]); if(!el) return;
    el.addEventListener('change',function(e){cfg.system[x[1]]=parseFloat(e.target.value);save();});
  });

  // Entités PAC
  var s2=mk('div','section');
  s2.innerHTML='<div class="stitle">Entités PAC (CAN bus)</div>';
  [['tExt','T° extérieure'],['tEauDep','T° eau départ'],['copInst','COP instantané'],['puissElec','Puissance élec (W)'],['puissTherm','Puissance therm (W)']].forEach(function(x){
    var row=mk('div','frow');
    row.innerHTML='<div style="font-size:11px;color:#8b949e">'+x[1]+'</div><input id="s-e-'+x[0]+'" value="'+(cfg.entities[x[0]]||'')+'" placeholder="sensor.entity_id">';
    s2.append(row);
    row.querySelector('input').addEventListener('change',function(e){cfg.entities[x[0]]=e.target.value;save();});
  });
  div.append(s2);

  // Pièces Tado
  var s3=mk('div','section');
  s3.innerHTML='<div class="stitle">Pièces Tado</div>';
  var roomList=mk('div');

  function rebuildRooms() {
    roomList.innerHTML='';
    if (cfg.rooms.length===0) {
      roomList.innerHTML='<div style="font-size:11px;color:#6b7280;padding:4px 0 8px">Aucune pièce configurée.</div>';
    } else {
      cfg.rooms.forEach(function(r){
        var box=mk('div','troom');
        box.innerHTML='<div class="troom-hdr">'
          +'<span class="troom-name">'+r.name+(r.etage?'<span style="font-size:10px;color:#6b7280;margin-left:6px;font-weight:400">'+r.etage+'</span>':'')+'</span>'
          +'<button class="btn-del">Supprimer</button></div>'
          +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">'
          +'<div><div class="lbl">Capteur température</div><input class="inp-t" value="'+(r.entityTemp||'')+'" placeholder="sensor.tado_..."></div>'
          +'<div><div class="lbl">Entité climate</div><input class="inp-s" value="'+(r.entitySetpoint||'')+'" placeholder="climate.tado_..."></div>'
          +'</div>'
          +'<div style="display:grid;grid-template-columns:1fr 90px;gap:6px">'
          +'<div><div class="lbl">Étage</div><input class="inp-e" value="'+(r.etage||'')+'" placeholder="RDC, 1er étage..."></div>'
          +'<div><div class="lbl">Surface m²</div><input type="number" step="0.5" class="inp-surf" value="'+(r.surface||'')+'" placeholder="25"></div>'
          +'</div>';
        box.querySelector('.btn-del').addEventListener('click',function(){cfg.rooms=cfg.rooms.filter(function(x){return x.id!==r.id;});save();rebuildRooms();});
        box.querySelector('.inp-t').addEventListener('change',function(e){r.entityTemp=e.target.value;save();});
        box.querySelector('.inp-s').addEventListener('change',function(e){r.entitySetpoint=e.target.value;save();});
        box.querySelector('.inp-e').addEventListener('change',function(e){r.etage=e.target.value;save();rebuildRooms();});
        box.querySelector('.inp-surf').addEventListener('change',function(e){r.surface=parseFloat(e.target.value)||0;save();});
        roomList.append(box);
      });
    }
  }
  rebuildRooms();
  s3.append(roomList);

  // Formulaire d'ajout
  var addbox=mk('div','addbox');
  addbox.innerHTML='<div style="font-size:11px;font-weight:600;color:#58a6ff;margin-bottom:10px">Ajouter une pièce Tado</div>'
    +'<div class="g2" style="margin-bottom:8px">'
    +'<div><div class="lbl">Nom *</div><input id="nr-n" placeholder="Ex: Salon"></div>'
    +'<div><div class="lbl">Étage</div><input id="nr-e" placeholder="Ex: RDC, 1er étage..."></div>'
    +'</div>'
    +'<div class="g3" style="margin-bottom:10px">'
    +'<div><div class="lbl">Capteur température</div><input id="nr-t" placeholder="sensor.tado_salon_temperature"></div>'
    +'<div><div class="lbl">Entité climate</div><input id="nr-s" placeholder="climate.tado_salon"></div>'
    +'<div><div class="lbl">Surface (m²)</div><input type="number" step="0.5" id="nr-surf" placeholder="Ex: 25"></div>'
    +'</div>'
    +'<button class="btn-add" id="btn-add">Ajouter cette pièce</button>';
  s3.append(addbox);
  div.append(s3);

  document.getElementById('btn-add').addEventListener('click',function(){
    var name=(document.getElementById('nr-n').value||'').trim();
    var etage=(document.getElementById('nr-e').value||'').trim();
    var temp=(document.getElementById('nr-t').value||'').trim();
    var sp=(document.getElementById('nr-s').value||'').trim();
    var surf=parseFloat(document.getElementById('nr-surf').value)||0;
    if (!name){document.getElementById('nr-n').style.borderColor='#f85149';document.getElementById('nr-n').focus();return;}
    document.getElementById('nr-n').style.borderColor='';
    cfg.rooms.push({id:Date.now(),name:name,etage:etage,entityTemp:temp,entitySetpoint:sp,surface:surf});
    save();
    ['nr-n','nr-e','nr-t','nr-s','nr-surf'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
    rebuildRooms();
  });

  div.append(mk('div','note','💡 <strong>Trouver les entity_id Tado</strong> : HA → Outils de développement → États → filtrer "tado". Copiez l\'entity_id exact dans les champs ci-dessus.'));
}

// ── Init ─────────────────────────────────────────────────────────────────────────
renderCurrent();
appRefresh();
setInterval(appRefresh,(cfg.system.refreshMin||5)*60000);
</script>
</body>
</html>
