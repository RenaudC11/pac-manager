<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAC Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh}
input{background:#161b22;border:1px solid #30363d;border-radius:5px;color:#c9d1d9;padding:6px 9px;font-size:12px;width:100%;outline:none;font-family:inherit}
input:focus{border-color:#58a6ff}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#161b22}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
.header{background:#161b22;border-bottom:1px solid #21262d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:26px;height:26px;background:#f59e0b22;border:1px solid #f59e0b44;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tabs{background:#161b22;border-bottom:1px solid #21262d;display:flex;padding:0 14px;gap:2px;flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#8b949e;padding:9px 12px;cursor:pointer;font-size:12px;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:#e6edf3;border-bottom-color:#58a6ff}
.content{padding:14px}
.section{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:14px;margin-bottom:14px}
.stitle{font-size:12px;font-weight:600;color:#e6edf3;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid #21262d}
.g-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.g-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.metric{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:12px 13px}
.mval{font-size:21px;font-weight:700;font-family:monospace;color:#e6edf3;line-height:1.1}
.lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.rcard{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:10px 12px;border-top-width:3px}
.fc-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fc-cell{text-align:center;min-width:58px;padding:7px 5px;background:#0d1117;border-radius:6px;border:1px solid #21262d;flex-shrink:0}
.loi-bar{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
.loi-cell{text-align:center;min-width:58px;padding:8px 4px;background:#0d1117;border-radius:6px}
.btn{border-radius:6px;padding:7px 14px;font-size:12px;font-weight:500;background:#1f6feb22;border:1px solid #1f6feb55;color:#58a6ff}
.btn:disabled{opacity:.5;cursor:wait}
.btn-add{border-radius:6px;padding:8px 16px;font-size:12px;font-weight:600;background:#1f6feb33;border:1px solid #58a6ff66;color:#58a6ff;width:100%;margin-top:8px}
.btn-del{background:none;border:1px solid #f8514944;color:#f85149;border-radius:4px;padding:4px 8px;font-size:11px;flex-shrink:0}
.badge{border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
.warn{padding:10px;background:#1a1700;border:1px solid #d2992244;border-radius:7px;font-size:11px;color:#d29922;margin-bottom:10px}
.info{padding:10px;background:#0a1a2a;border:1px solid #1f6feb44;border-radius:7px;font-size:11px;color:#58a6ff;margin-bottom:10px}
.ok{padding:10px;background:#0a1a0a;border:1px solid #3fb95033;border-radius:7px;font-size:11px;color:#3fb950;margin-bottom:10px}
.errbox{padding:14px;background:#1c1010;border:1px solid #f8514944;border-radius:7px;color:#f85149;font-size:12px;margin-bottom:10px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ai-card{border:1px solid #21262d;border-radius:7px;padding:14px;margin-bottom:10px}
.ai-rec{background:#0a1a0a;border:1px solid #3fb95033;border-radius:7px;padding:14px;margin-bottom:10px}
.frow{display:grid;grid-template-columns:160px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.note{padding:10px;background:#0c1020;border:1px solid #21262d;border-radius:7px;font-size:10px;color:#6e7681;line-height:1.7;margin-top:10px}
.empty{background:#161b22;border:1px solid #21262d;border-radius:7px;padding:32px;text-align:center;color:#6b7280}
.troom{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px;margin-bottom:8px}
.troom-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.troom-name{font-size:12px;font-weight:600;color:#e6edf3}
.troom-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.addbox{background:#0a1520;border:1px solid #1f6feb33;border-radius:7px;padding:14px;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">♨</div>
  <div>
    <div style="font-size:14px;font-weight:700;color:#e6edf3;line-height:1">PAC Manager</div>
    <div style="font-size:10px;color:#6b7280">Vitocal 150-A · Lyon · v1.6.0</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
    <span class="dot" id="dot" style="background:#3fb950"></span>
    <span style="font-size:10px;color:#6b7280" id="status">—</span>
    <button style="background:none;border:1px solid #30363d;color:#8b949e;border-radius:5px;padding:4px 9px;font-size:11px" onclick="appRefresh()">⟳</button>
  </div>
</div>
<div class="tabs">
  <button class="tab active" id="tb-dashboard" onclick="showTab('dashboard')">◈ Dashboard</button>
  <button class="tab" id="tb-ai" onclick="showTab('ai')">◉ IA</button>
  <button class="tab" id="tb-functional" onclick="showTab('functional')">◧ Fonctionnel</button>
  <button class="tab" id="tb-system" onclick="showTab('system')">◌ Système</button>
</div>
<div class="content">
  <div id="p-dashboard"></div>
  <div id="p-ai" style="display:none"></div>
  <div id="p-functional" style="display:none"></div>
  <div id="p-system" style="display:none"></div>
</div>
<script>
// Clé Gemini injectée par run.sh au démarrage du container
var GEMINI_API_KEY = '__GEMINI_API_KEY__';

// Stockage permanent
var SK = 'pac-mgr';
(function migrate() {
  if (localStorage.getItem(SK)) return;
  var old = ['pac-mgr-v5','pac-mgr-v4','pac-mgr-v3','pac-mgr-v2'];
  for (var i=0; i<old.length; i++) {
    var v = localStorage.getItem(old[i]);
    if (v) { localStorage.setItem(SK, v); localStorage.removeItem(old[i]); return; }
  }
})();

var DEF = {
  system: {haUrl:'http://homeassistant.local:8123',haToken:'',lat:45.75,lon:4.85,refreshMin:5},
  functional: {loiEauA:43.0,loiEauB:-1.1,tBalance:16.0,consigneJour:18,consigneNuit:18,heureNuit:'21:30',heureJour:'05:30',consigneECS:50,hystECS:5},
  entities: {tExt:'',tEauDep:'',copInst:'',puissElec:'',puissTherm:''},
  rooms: []
};

function loadCfg() {
  try {
    var s = JSON.parse(localStorage.getItem(SK));
    if (!s) return JSON.parse(JSON.stringify(DEF));
    return {
      system: Object.assign({}, DEF.system, s.system),
      functional: Object.assign({}, DEF.functional, s.functional),
      entities: Object.assign({}, DEF.entities, s.entities),
      rooms: s.rooms || []
    };
  } catch(e) { return JSON.parse(JSON.stringify(DEF)); }
}

var cfg = loadCfg();
var haData = {}, weather = null, lastUpd = null, aiResult = null, currentTab = 'dashboard';

function save() { try { localStorage.setItem(SK, JSON.stringify(cfg)); } catch(e) {} }
function tEauCalc(t) { return Math.max(20, Math.min(55, cfg.functional.loiEauA + cfg.functional.loiEauB * t)); }
function fmt(v, d) { d = d === undefined ? 1 : d; return v != null ? parseFloat(v).toFixed(d) : '—'; }
function isNight() {
  var n = new Date(), cur = n.getHours()*60 + n.getMinutes();
  var nh = parseInt(cfg.functional.heureNuit.split(':')[0]);
  var nm = parseInt(cfg.functional.heureNuit.split(':')[1]);
  var dh = parseInt(cfg.functional.heureJour.split(':')[0]);
  var dm = parseInt(cfg.functional.heureJour.split(':')[1]);
  var ni = nh*60+nm, di = dh*60+dm;
  return ni > di ? (cur >= ni || cur < di) : (cur >= ni && cur < di);
}
function haGet(id) {
  return fetch(cfg.system.haUrl + '/api/states/' + id, {
    headers: {Authorization: 'Bearer ' + cfg.system.haToken, 'Content-Type': 'application/json'}
  }).then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function setStatus(col, txt) {
  var d = document.getElementById('dot'), s = document.getElementById('status');
  if (d) d.style.background = col;
  if (s) s.textContent = txt;
}
function mk(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function appRefresh() {
  setStatus('#d29922', 'Actualisation…');
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+cfg.system.lat+'&longitude='+cfg.system.lon+'&current_weather=true&hourly=temperature_2m,cloud_cover&forecast_days=2&timezone=Europe%2FParis')
    .then(function(r){ return r.json(); }).then(function(d){ weather=d; }).catch(function(){ weather=null; })
    .then(function() {
      if (!cfg.system.haToken) { lastUpd=new Date(); setStatus('#3fb950',lastUpd.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})); renderCurrent(); return; }
      var ids = Object.values(cfg.entities).concat(cfg.rooms.reduce(function(a,r){ return a.concat([r.entityTemp,r.entitySetpoint]); },[])).filter(Boolean);
      return Promise.all(ids.map(function(id){ return haGet(id).then(function(d){ haData[id]=d; }).catch(function(){}); }));
    })
    .then(function() { lastUpd=new Date(); setStatus('#3fb950',lastUpd.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})); renderCurrent(); });
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  var btn = document.getElementById('tb-'+id); if (btn) btn.classList.add('active');
  ['dashboard','ai','functional','system'].forEach(function(t){
    var p = document.getElementById('p-'+t); if (p) p.style.display = t===id?'block':'none';
  });
  currentTab = id; renderCurrent();
}

function renderCurrent() {
  if (currentTab==='dashboard') renderDashboard();
  else if (currentTab==='ai') renderAI();
  else if (currentTab==='functional') renderFunctional();
  else if (currentTab==='system') renderSystem();
}

// ── Dashboard ──────────────────────────────────────────────────────────────────
function renderDashboard() {
  var div = document.getElementById('p-dashboard'); if (!div) return; div.innerHTML='';
  var tExt = cfg.entities.tExt && haData[cfg.entities.tExt] ? parseFloat(haData[cfg.entities.tExt].state) : (weather&&weather.current_weather?weather.current_weather.temperature:null);
  var tEauRec = tExt!==null ? tEauCalc(tExt) : null;
  var tEauAct = cfg.entities.tEauDep&&haData[cfg.entities.tEauDep] ? parseFloat(haData[cfg.entities.tEauDep].state) : null;
  var cop = cfg.entities.copInst&&haData[cfg.entities.copInst] ? parseFloat(haData[cfg.entities.copInst].state) : null;
  var pw = cfg.entities.puissElec&&haData[cfg.entities.puissElec] ? parseFloat(haData[cfg.entities.puissElec].state) : null;
  var night = isNight();
  var mg = mk('div','g-auto');
  [['T° extérieure',tExt!==null?fmt(tExt):null,'°C',weather?'Open-Meteo':'—','#58a6ff'],
   ['T° eau actuelle',tEauAct!==null?fmt(tEauAct):null,'°C',tEauAct?'HA':'Non configuré','#f59e0b'],
   ['T° eau cible',tEauRec!==null?fmt(tEauRec):null,'°C','Loi d\'eau','#d29922'],
   ['COP',cop!==null?fmt(cop,2):null,'',cop?(cop>4?'Excellent':cop>3?'Bon':'Moyen'):'','#3fb950'],
   ['Puissance',pw!==null?String(Math.round(pw)):null,'W','PAC','#f85149'],
   ['Mode',night?'Nuit':'Jour','','Consigne '+(night?cfg.functional.consigneNuit:cfg.functional.consigneJour)+'°C',night?'#58a6ff':'#f59e0b']
  ].forEach(function(x){
    var c=mk('div','metric'); c.style.borderLeft='3px solid '+x[4];
    c.innerHTML='<div class="lbl">'+x[0]+'</div><div class="mval">'+(x[1]||'—')+(x[2]?'<span style="font-size:12px;color:#6b7280;margin-left:2px">'+x[2]+'</span>':'')+'</div>'+(x[3]?'<div style="font-size:10px;color:#6b7280;margin-top:3px">'+x[3]+'</div>':'');
    mg.append(c);
  });
  div.append(mg);

  if (cfg.rooms.length>0) {
    var rh=mk('div'); rh.innerHTML='<div style="font-size:11px;font-weight:600;color:#e6edf3;margin-bottom:8px;text-transform:uppercase;letter-spacing:.07em">Pièces Tado</div>';
    var rg=mk('div','g-rooms');
    cfg.rooms.forEach(function(r){
      var t=haData[r.entityTemp]?haData[r.entityTemp].state:null;
      var sp=haData[r.entitySetpoint]?(haData[r.entitySetpoint].attributes&&haData[r.entitySetpoint].attributes.temperature?haData[r.entitySetpoint].attributes.temperature:haData[r.entitySetpoint].state):null;
      var d=t&&sp?parseFloat(t)-parseFloat(sp):null;
      var col=d===null?'#6b7280':d>=0?'#3fb950':d<-1.5?'#f85149':'#d29922';
      var c=mk('div','rcard'); c.style.borderTopColor=col;
      c.innerHTML='<div style="font-size:11px;color:#8b949e;margin-bottom:5px;font-weight:500">'+r.name+'</div>'
        +'<div style="display:flex;align-items:baseline;gap:5px"><span style="font-size:20px;font-weight:700;font-family:monospace;color:#e6edf3">'+(t?fmt(t)+'°':'—')+'</span>'+(sp?'<span style="font-size:11px;color:#6b7280">/ '+fmt(sp,0)+'°C</span>':'')+'</div>'
        +(d!==null?'<div style="font-size:10px;color:'+col+';margin-top:2px">'+(d>=0?'+':'')+d.toFixed(1)+'°C vs consigne</div>':'');
      rg.append(c);
    });
    rh.append(rg); div.append(rh);
  } else {
    div.append(mk('div','info','💡 Aucune pièce Tado — ajoutez-en dans l\'onglet <strong>Système</strong>.'));
  }

  if (weather&&weather.hourly) {
    var now=new Date(),h=weather.hourly;
    var fc=h.time.map(function(t,i){return {time:t,temp:h.temperature_2m[i],cloud:h.cloud_cover[i]};})
      .filter(function(p){var d=new Date(p.time);return d>=now&&d<=new Date(now.getTime()+24*3600000);})
      .filter(function(_,i){return i%2===0;}).slice(0,8);
    if (fc.length) {
      var fs=mk('div','section','<div class="stitle">Prévisions 24h</div>');
      var bar=mk('div','fc-bar');
      fc.forEach(function(p){
        var tv=tEauCalc(p.temp),off=p.temp>=cfg.functional.tBalance,col=p.temp<5?'#58a6ff':p.temp>15?'#3fb950':'#c9d1d9';
        var cell=mk('div','fc-cell');
        cell.innerHTML='<div style="font-size:10px;color:#6b7280;margin-bottom:3px">'+p.time.slice(11,16)+'</div>'
          +'<div style="font-size:14px;font-weight:700;font-family:monospace;color:'+col+'">'+p.temp.toFixed(0)+'°</div>'
          +'<div style="font-size:9px;color:'+(off?'#6b7280':'#f59e0b')+';margin-top:2px">'+(off?'off':tv.toFixed(0)+'°eau')+'</div>'
          +'<div style="font-size:9px;color:#4b5563;margin-top:1px">'+p.cloud+'%☁</div>';
        bar.append(cell);
      });
      fs.append(bar); div.append(fs);
    }
  }
  if (!cfg.system.haToken) div.append(mk('div','warn','⚠ Token HA non configuré — onglet Système.'));
  if (lastUpd){var ts=mk('div');ts.style.cssText='margin-top:10px;font-size:10px;color:#4b5563;text-align:right';ts.textContent='Mis à jour '+lastUpd.toLocaleTimeString('fr-FR');div.append(ts);}
}

// ── AI ─────────────────────────────────────────────────────────────────────────
function renderAI() {
  var div=document.getElementById('p-ai'); if(!div) return; div.innerHTML='';
  var apiOk=GEMINI_API_KEY&&GEMINI_API_KEY.length>10&&GEMINI_API_KEY.indexOf('__GEMINI')===-1;
  var hdr=mk('div'); hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:14px';
  hdr.innerHTML='<div><div style="font-size:14px;font-weight:600;color:#e6edf3">Conseiller IA <span style="font-size:10px;color:#6b7280;font-weight:400">Gemini 1.5 Flash</span></div><div style="font-size:11px;color:#8b949e;margin-top:2px">Analyse basée sur l\'état actuel</div></div>';
  var btn=mk('button','btn'); btn.textContent='▶ Analyser'; btn.onclick=runAI; hdr.append(btn); div.append(hdr);
  if (!apiOk) {
    div.append(mk('div','errbox','⚠ Clé API Gemini non configurée.<br><br>1. Va sur <strong>aistudio.google.com</strong> → Get API Key → Create API Key (gratuit)<br>2. Dans HA : Paramètres → Add-ons → PAC Manager → Configuration → colle la clé dans <strong>gemini_api_key</strong><br>3. Redémarre l\'add-on'));
    return;
  }
  div.append(mk('div','ok','✓ Clé Gemini active ('+GEMINI_API_KEY.length+' caractères) — gratuit jusqu\'à 1500 req/jour'));
  if (!aiResult){div.append(mk('div','empty','<div style="font-size:28px;margin-bottom:10px">🤖</div><div>Cliquez sur Analyser.</div>'));return;}
  if (aiResult.error){div.append(mk('div','errbox',aiResult.error));return;}
  var PC={'Excellent':'#3fb950','Bon':'#58a6ff','Moyen':'#d29922','À améliorer':'#f85149'};
  var ac=PC[aiResult.performance]||'#6b7280';
  var card=mk('div','ai-card'); card.style.borderLeft='4px solid '+ac;
  card.innerHTML='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="badge" style="background:'+ac+'22;color:'+ac+';border:1px solid '+ac+'44">'+(aiResult.performance||'')+'</span><span style="font-size:10px;color:#4b5563">'+(aiResult.ts?aiResult.ts.toLocaleTimeString('fr-FR'):'')+'</span></div><p style="margin:0;font-size:13px;line-height:1.65;color:#c9d1d9">'+(aiResult.analyse||'')+'</p>';
  div.append(card);
  if (aiResult.tEauRecommandee) {
    var tEauAct=cfg.entities.tEauDep&&haData[cfg.entities.tEauDep]?parseFloat(haData[cfg.entities.tEauDep].state):null;
    var rec=mk('div','ai-rec');
    rec.innerHTML='<div class="lbl">T° eau recommandée</div><div style="display:flex;align-items:baseline;gap:8px;margin:4px 0 8px"><span style="font-size:28px;font-weight:700;font-family:monospace;color:#3fb950">'+parseFloat(aiResult.tEauRecommandee).toFixed(1)+'°C</span>'+(tEauAct?'<span style="font-size:12px;color:#6b7280">actuel: '+fmt(tEauAct)+'°C</span>':'')+'</div><p style="margin:0;font-size:12px;color:#8b949e;line-height:1.55">'+(aiResult.justification||'')+'</p>';
    div.append(rec);
  }
  if (aiResult.actions&&aiResult.actions.length) {
    var ac2=mk('div','section','<div class="stitle">Actions recommandées</div>');
    aiResult.actions.forEach(function(a){var row=mk('div');row.style.cssText='display:flex;gap:6px;margin-bottom:6px;font-size:12px;color:#c9d1d9;line-height:1.5';row.innerHTML='<span style="color:#58a6ff;flex-shrink:0">→</span>'+a;ac2.append(row);});
    div.append(ac2);
  }
  if (aiResult.alertes&&aiResult.alertes.length) {
    var al=mk('div','section');al.style.cssText='background:#1a1500;border-color:#d2992233';
    aiResult.alertes.forEach(function(a){al.append(mk('div',null,'<span style="font-size:12px;color:#d29922">⚠ '+a+'</span>'));});
    div.append(al);
  }
}

function runAI() {
  var apiOk=GEMINI_API_KEY&&GEMINI_API_KEY.length>10&&GEMINI_API_KEY.indexOf('__GEMINI')===-1;
  if (!apiOk){alert('Clé API Gemini non configurée.');return;}
  var btn=document.querySelector('#p-ai .btn');
  if (btn){btn.disabled=true;btn.textContent='⟳ Analyse…';}

  var tExt=cfg.entities.tExt&&haData[cfg.entities.tExt]?parseFloat(haData[cfg.entities.tExt].state):(weather&&weather.current_weather?weather.current_weather.temperature:null);
  var tEauRec=tExt!==null?tEauCalc(tExt):null;
  var tEauAct=cfg.entities.tEauDep&&haData[cfg.entities.tEauDep]?parseFloat(haData[cfg.entities.tEauDep].state):null;
  var cop=cfg.entities.copInst&&haData[cfg.entities.copInst]?parseFloat(haData[cfg.entities.copInst].state):null;
  var pw=cfg.entities.puissElec&&haData[cfg.entities.puissElec]?parseFloat(haData[cfg.entities.puissElec].state):null;

  var rCtx=cfg.rooms.map(function(r){
    var t=haData[r.entityTemp]?haData[r.entityTemp].state:'?';
    var sp=haData[r.entitySetpoint]?(haData[r.entitySetpoint].attributes&&haData[r.entitySetpoint].attributes.temperature?haData[r.entitySetpoint].attributes.temperature:cfg.functional.consigneJour):cfg.functional.consigneJour;
    return '- '+r.name+': '+t+'C (consigne '+sp+'C)';
  }).join('\n')||'(aucune piece)';

  var now=new Date();
  var fCtx='(indisponible)';
  if (weather&&weather.hourly) {
    var h=weather.hourly;
    var fc=h.time.map(function(t,i){return {time:t,temp:h.temperature_2m[i],cloud:h.cloud_cover[i]};})
      .filter(function(p){var d=new Date(p.time);return d>=now&&d<=new Date(now.getTime()+24*3600000);})
      .filter(function(_,i){return i%2===0;}).slice(0,8);
    if (fc.length) fCtx=fc.map(function(p){return '  '+p.time.slice(11,16)+': '+p.temp+'C nuages '+p.cloud+'%';}).join('\n');
  }

  var prompt='Expert PAC. Reponds UNIQUEMENT en JSON valide, sans markdown, sans texte avant ou apres.\n'
  +'Chaque champ texte: maximum 15 mots.\n\n'
  +'Donnees: Text='+tExt+'C, Teau_act='+tEauAct+'C, Teau_calc='+(tEauRec?tEauRec.toFixed(1):null)+'C'
  +', COP='+cop+', Puiss='+pw+'W, Mode='+(isNight()?'NUIT':'JOUR')+'\n'
  +'Pieces: '+rCtx.replace(/\n/g,' | ')+'\n'
  +'Meteo: '+fCtx.replace(/\n/g,' | ')+'\n\n'
  +'JSON attendu (respecte exactement cette structure):\n'
  +'{"analyse":"max 15 mots","tEauRecommandee":35.5,"justification":"max 15 mots","actions":["action courte"],"performance":"Bon","alertes":[]}';
  
  // API Gemini — gratuit jusqu'à 1500 req/jour
var url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key='+GEMINI_API_KEY;

fetch(url, {
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
    contents:[{parts:[{text:prompt}]}],
    generationConfig:{
      temperature:0,
      maxOutputTokens:1024,
      responseMimeType:'application/json',
      responseSchema:{
        type:'object',
        properties:{
          analyse:{type:'string'},
          tEauRecommandee:{type:'number'},
          justification:{type:'string'},
          actions:{type:'array',items:{type:'string'}},
          performance:{type:'string',enum:['Excellent','Bon','Moyen','A ameliorer']},
          alertes:{type:'array',items:{type:'string'}}
        },
        required:['analyse','tEauRecommandee','justification','actions','performance','alertes']
      }
    }
  })
})
  .then(function(data){
    var rawText='';
    try { rawText=data.candidates[0].content.parts[0].text; } 
    catch(e){ throw new Error('Reponse Gemini inattendue: '+JSON.stringify(data).slice(0,200)); }
    aiResult=JSON.parse(rawText);
    aiResult.ts=new Date();
  })
  
  .catch(function(e){aiResult={error:e.message,ts:new Date()};})
  .then(function(){renderAI();});
}

// ── Functional ──────────────────────────────────────────────────────────────────
function renderFunctional() {
  var div=document.getElementById('p-functional'); if(!div) return; div.innerHTML='';
  var s1=mk('div','section');
  s1.innerHTML='<div class="stitle">Loi d\'eau</div><div class="g3" style="margin-bottom:14px">'
    +'<div><div class="lbl">T eau a 0C ext</div><input type="number" step="0.5" id="f-loiA" value="'+cfg.functional.loiEauA+'"></div>'
    +'<div><div class="lbl">Pente (C/C)</div><input type="number" step="0.05" id="f-loiB" value="'+cfg.functional.loiEauB+'"></div>'
    +'<div><div class="lbl">Point equilibre (C)</div><input type="number" step="0.5" id="f-loiBal" value="'+cfg.functional.tBalance+'"></div>'
    +'</div>';
  var bar=mk('div','loi-bar');
  [-10,-5,0,5,10,15,20].forEach(function(t){
    var v=tEauCalc(t),off=t>=cfg.functional.tBalance,col=v>45?'#f85149':v>35?'#f59e0b':'#3fb950';
    var c=mk('div','loi-cell');c.style.cssText='opacity:'+(off?0.4:1)+';border:1px solid '+(off?'#21262d':'#30363d');
    c.innerHTML='<div style="font-size:10px;color:#6b7280;margin-bottom:3px">'+t+'°ext</div><div style="font-size:15px;font-weight:700;font-family:monospace;color:'+(off?'#6b7280':col)+'">'+(off?'OFF':v.toFixed(0)+'°')+'</div>';
    bar.append(c);
  });
  s1.append(bar); div.append(s1);
  [['f-loiA','loiEauA'],['f-loiB','loiEauB'],['f-loiBal','tBalance']].forEach(function(x){
    var el=document.getElementById(x[0]);if(!el)return;
    el.addEventListener('change',function(e){cfg.functional[x[1]]=parseFloat(e.target.value);save();renderFunctional();});
  });
  var s2=mk('div','section');
  s2.innerHTML='<div class="stitle">Consignes</div><div class="g3">'
    +'<div><div class="lbl">Jour (C)</div><input type="number" step="0.5" id="f-cJ" value="'+cfg.functional.consigneJour+'"></div>'
    +'<div><div class="lbl">Nuit (C)</div><input type="number" step="0.5" id="f-cN" value="'+cfg.functional.consigneNuit+'"></div>'
    +'<div><div class="lbl">ECS (C)</div><input type="number" step="1" id="f-cE" value="'+cfg.functional.consigneECS+'"></div>'
    +'<div><div class="lbl">Debut nuit</div><input type="time" id="f-hN" value="'+cfg.functional.heureNuit+'"></div>'
    +'<div><div class="lbl">Fin nuit</div><input type="time" id="f-hJ" value="'+cfg.functional.heureJour+'"></div>'
    +'<div><div class="lbl">Hysteresis ECS</div><input type="number" step="1" id="f-hE" value="'+cfg.functional.hystECS+'"></div>'
    +'</div>';
  div.append(s2);
  [['f-cJ','consigneJour'],['f-cN','consigneNuit'],['f-cE','consigneECS'],['f-hE','hystECS']].forEach(function(x){
    var el=document.getElementById(x[0]);if(!el)return;
    el.addEventListener('change',function(e){cfg.functional[x[1]]=parseFloat(e.target.value);save();});
  });
  [['f-hN','heureNuit'],['f-hJ','heureJour']].forEach(function(x){
    var el=document.getElementById(x[0]);if(!el)return;
    el.addEventListener('change',function(e){cfg.functional[x[1]]=e.target.value;save();});
  });
}

// ── System ──────────────────────────────────────────────────────────────────────
function renderSystem() {
  var div=document.getElementById('p-system'); if(!div) return; div.innerHTML='';
  var s1=mk('div','section');
  s1.innerHTML='<div class="stitle">Connexion Home Assistant</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +'<div><div class="lbl">URL HA</div><input id="s-url" value="'+cfg.system.haUrl+'"></div>'
    +'<div><div class="lbl">Token longue duree</div><input type="password" id="s-tok" value="'+cfg.system.haToken+'" placeholder="eyJ0eXAi..."></div>'
    +'<div class="g3">'
    +'<div><div class="lbl">Latitude</div><input type="number" step="0.01" id="s-lat" value="'+cfg.system.lat+'"></div>'
    +'<div><div class="lbl">Longitude</div><input type="number" step="0.01" id="s-lon" value="'+cfg.system.lon+'"></div>'
    +'<div><div class="lbl">Refresh (min)</div><input type="number" min="1" max="60" id="s-ref" value="'+cfg.system.refreshMin+'"></div>'
    +'</div></div>';
  div.append(s1);
  [['s-url','haUrl'],['s-tok','haToken']].forEach(function(x){
    var el=document.getElementById(x[0]);if(!el)return;
    el.addEventListener('change',function(e){cfg.system[x[1]]=e.target.value;save();});
  });
  [['s-lat','lat'],['s-lon','lon'],['s-ref','refreshMin']].forEach(function(x){
    var el=document.getElementById(x[0]);if(!el)return;
    el.addEventListener('change',function(e){cfg.system[x[1]]=parseFloat(e.target.value);save();});
  });

  var s2=mk('div','section');
  s2.innerHTML='<div class="stitle">Entites PAC (CAN bus)</div>';
  [['tExt','T ext'],['tEauDep','T eau depart'],['copInst','COP instantane'],['puissElec','Puissance elec (W)'],['puissTherm','Puissance therm (W)']].forEach(function(x){
    var row=mk('div','frow');
    row.innerHTML='<div style="font-size:11px;color:#8b949e">'+x[1]+'</div><input id="s-e-'+x[0]+'" value="'+(cfg.entities[x[0]]||'')+'" placeholder="sensor.entity_id">';
    s2.append(row);
    row.querySelector('input').addEventListener('change',function(e){cfg.entities[x[0]]=e.target.value;save();});
  });
  div.append(s2);

  var s3=mk('div','section');
  s3.innerHTML='<div class="stitle">Pieces Tado</div>';
  var roomList=mk('div');

  function rebuildRooms() {
    roomList.innerHTML='';
    if (cfg.rooms.length===0) {
      roomList.innerHTML='<div style="font-size:11px;color:#6b7280;padding:4px 0 8px">Aucune piece configuree.</div>';
    } else {
      cfg.rooms.forEach(function(r){
        var box=mk('div','troom');
        box.innerHTML='<div class="troom-hdr"><span class="troom-name">'+r.name+'</span><button class="btn-del">Supprimer</button></div>'
          +'<div class="troom-fields">'
          +'<div><div class="lbl">Capteur temperature</div><input class="inp-t" value="'+(r.entityTemp||'')+'" placeholder="sensor.tado_..."></div>'
          +'<div><div class="lbl">Entite climate</div><input class="inp-s" value="'+(r.entitySetpoint||'')+'" placeholder="climate.tado_..."></div>'
          +'</div>';
        box.querySelector('.btn-del').addEventListener('click',function(){cfg.rooms=cfg.rooms.filter(function(x){return x.id!==r.id;});save();rebuildRooms();});
        box.querySelector('.inp-t').addEventListener('change',function(e){r.entityTemp=e.target.value;save();});
        box.querySelector('.inp-s').addEventListener('change',function(e){r.entitySetpoint=e.target.value;save();});
        roomList.append(box);
      });
    }
  }
  rebuildRooms();
  s3.append(roomList);

  var addbox=mk('div','addbox');
  addbox.innerHTML='<div style="font-size:11px;font-weight:600;color:#58a6ff;margin-bottom:10px">Ajouter une piece Tado</div>'
    +'<div class="g3" style="margin-bottom:10px">'
    +'<div><div class="lbl">Nom *</div><input id="nr-n" placeholder="Ex: Salon"></div>'
    +'<div><div class="lbl">Capteur temperature</div><input id="nr-t" placeholder="sensor.tado_salon_temperature"></div>'
    +'<div><div class="lbl">Entite climate</div><input id="nr-s" placeholder="climate.tado_salon"></div>'
    +'</div>'
    +'<button class="btn-add" id="btn-add">Ajouter cette piece</button>';
  s3.append(addbox);
  div.append(s3);

  document.getElementById('btn-add').addEventListener('click',function(){
    var name=(document.getElementById('nr-n').value||'').trim();
    var temp=(document.getElementById('nr-t').value||'').trim();
    var sp=(document.getElementById('nr-s').value||'').trim();
    if (!name){document.getElementById('nr-n').style.borderColor='#f85149';document.getElementById('nr-n').focus();return;}
    document.getElementById('nr-n').style.borderColor='';
    cfg.rooms.push({id:Date.now(),name:name,entityTemp:temp,entitySetpoint:sp});
    save();
    document.getElementById('nr-n').value='';
    document.getElementById('nr-t').value='';
    document.getElementById('nr-s').value='';
    rebuildRooms();
  });

  div.append(mk('div','note','Trouver les entity_id Tado : HA > Outils de developpement > Etats > filtrer "tado". Copiez l\'entity_id exact.'));
}

// ── Init ────────────────────────────────────────────────────────────────────────
renderCurrent();
appRefresh();
setInterval(appRefresh,(cfg.system.refreshMin||5)*60000);
</script>
