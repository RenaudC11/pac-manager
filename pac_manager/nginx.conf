worker_processes 1;
events { worker_connections 1024; }
http {
  include mime.types;
  default_type application/octet-stream;
  server {
    listen 8099;
    root /var/www/html;
    index index.html;
    add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;";
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
